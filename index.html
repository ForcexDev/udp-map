<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>UDP Map</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

    :root {
      --udp-red: #D41F2D;
      --udp-red-dark: #b11a25;
      --udp-red-light: #ffebec;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    *::-webkit-scrollbar {
      display: none !important;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1a1a1a;
    }

    #root {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .leaflet-container {
      width: 100% !important;
      height: 100% !important;
      z-index: 1;
      background-color: #fcfcfc !important;
    }

    .glass-hud {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .premium-shadow {
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.1);
    }

    .red-shadow {
      box-shadow: 0 10px 25px -5px rgba(212, 31, 45, 0.3);
    }

    @keyframes modal-in {
      from {
        transform: translateY(100%);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .animate-modal-in {
      animation: modal-in 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .pro-popup .leaflet-popup-content-wrapper {
      border-radius: 24px;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .pro-popup .leaflet-popup-content {
      margin: 0;
      width: 280px !important;
    }

    .pro-popup .leaflet-popup-tip {
      box-shadow: none;
    }

    /* Layers Control Styling */
    .leaflet-control-layers {
      border-radius: 16px !important;
      border: 1px solid rgba(255, 255, 255, 0.5) !important;
      box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.12) !important;
      backdrop-filter: blur(16px);
      background: rgba(255, 255, 255, 0.9) !important;
      padding: 8px !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-size: 12px !important;
      font-weight: 700 !important;
    }

    .leaflet-control-layers-expanded {
      padding: 12px 16px !important;
    }

    .leaflet-control-layers label {
      margin-bottom: 4px;
    }

    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0px 1000px white inset !important;
    }

    button:active {
      transform: scale(0.96);
    }

    @keyframes scan {
      0% {
        transform: translateY(-100%);
      }

      100% {
        transform: translateY(200%);
      }
    }

    .animate-scan {
      animation: scan 2s ease-in-out infinite;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
    "react-leaflet": "https://esm.sh/react-leaflet@^5.0.0",
    "leaflet": "https://esm.sh/leaflet@^1.9.4"
  }
}
</script>
  <link rel="stylesheet" href="/src/styles/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/app/index.tsx"></script>
</body>

</html>
