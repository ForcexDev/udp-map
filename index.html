<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <meta name="theme-color" content="#D41F2D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Mapa colaborativo de pines, eventos y foro para la comunidad de la Universidad Diego Portales"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>UDP Map</title>
    <script>
      // Solo PWA de iOS a pantalla completa: su viewport mide la pantalla menos
      // el área segura superior y no se pinta nada bajo el documento, por eso
      // html/body/#root toman esta altura (ver index.css). La pantalla no cambia
      // con el teclado, así que es estable; con ventana partida (iPad) se deja
      // el valor CSS.
      ;(function () {
        if (navigator.standalone !== true) return
        function setAppHeight() {
          var landscape = window.matchMedia('(orientation: landscape)').matches
          var long = Math.max(screen.width, screen.height)
          var short = Math.min(screen.width, screen.height)
          var root = document.documentElement.style
          if (Math.abs(window.innerWidth - (landscape ? long : short)) > 1) {
            root.removeProperty('--app-height')
            return
          }
          var h = Math.max(landscape ? short : long, window.innerHeight)
          root.setProperty('--app-height', h + 'px')
        }
        setAppHeight()
        window.addEventListener('resize', setAppHeight)
        window.addEventListener('orientationchange', setAppHeight)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
